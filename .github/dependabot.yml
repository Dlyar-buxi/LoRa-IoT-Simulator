# Dependabot: automated pull requests for outdated / vulnerable dependencies.
# Docs: https://docs.github.com/en/code-security/dependabot
version: 2

updates:
  # -------- Python runtime + dev dependencies (requirements.txt / pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      # Only patch bumps for very-tight pins (e.g. fastapi PATCH might change schema).
      # Keep the rule lenient so users still see MINOR upgrades and can review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # -------- Docker base images (python:3.12-slim, eclipse-mosquitto, etc.)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps-docker)"

  # -------- GitHub Actions (checkout/setup-python/codeql/..)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "chore(ci-actions)"
