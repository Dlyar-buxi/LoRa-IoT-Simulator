name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # backend API + engine unit/integration tests (hermetic, no broker)
      - name: Run backend tests
        run: pytest backend/ -q

      # simulator + gateway self-tests (standard library only)
      - name: Run simulator & gateway self-tests
        run: pytest simulator/ gateway/ -q
